name: Build Electron Client

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: win-x64
            runner: windows-latest
            build_script: build-client:win-x64
            artifact_glob: dist/*.exe
          - target_name: linux-x64
            runner: ubuntu-latest
            build_script: build-client:linux-x64
            artifact_glob: dist/*.AppImage
          - target_name: linux-arm64
            runner: ubuntu-24.04-arm
            build_script: build-client:linux-arm64
            artifact_glob: dist/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Ensure app-builder is executable (Linux)
        if: runner.os == 'Linux'
        run: chmod +x node_modules/app-builder-bin/linux/*/app-builder || true

      - name: Build
        run: npm run ${{ matrix.build_script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show downloaded files
        run: ls -R release-assets

      - name: Publish versioned release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.app_version.outputs.version }}-build.${{ github.run_number }}
          name: v${{ steps.app_version.outputs.version }}-build.${{ github.run_number }}
          artifacts: release-assets/*
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          prerelease: true

      - name: Publish rolling latest release (overwrite)
        uses: ncipollo/release-action@v1
        with:
          tag: latest-build
          name: latest-build
          body: Latest auto build from ${{ github.sha }}
          artifacts: release-assets/*
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          prerelease: true
